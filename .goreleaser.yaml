# GoReleaser fills in the tagged release: it builds the platform
# binaries, uploads them, and updates the Homebrew tap
# (technical/distribution/pipeline.md).
#
# The cut is not here. scripts/release.sh writes the changelog, runs the
# suite, commits, tags, pushes, and creates the GitHub release with
# generated notes; this file adds to that release rather than creating
# one of its own — hence `release.mode: append` and a disabled
# changelog.
#
# The pinned WritRun tag reaches the notes as $WRITRUN_TAG, which
# scripts/writrun-tag.sh reads from cmd/writrun/main.go. An unset
# variable fails the template, so notes that name no tag are never
# published.

version: 2

project_name: writrun

before:
  hooks:
    - go mod download

builds:
  - id: writrun
    main: ./cmd/writrun
    binary: writrun
    # Static: no cgo, on every supported platform
    # (technical/runtime/platforms.md).
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # `main.version` is cmd/writrun/main.go's stamp seam; buildVersion()
    # prefers it over the module version the toolchain records for
    # `go install`. The `v` stays on: `writrun --version` prints the
    # string as given.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: writrun
    ids: [writrun]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# The notes are the cut's, generated by `gh release create
# --generate-notes`. GoReleaser adds the footer below and nothing else.
changelog:
  disable: true

release:
  mode: append
  footer: |

    ---

    Pins WritRun `{{ .Env.WRITRUN_TAG }}`.

    ```
    brew install thomasfranke/tap/writrun
    go install github.com/thomasfranke/writrun-cli/cmd/writrun@{{ .Tag }}
    ```

# The tap: thomasfranke/homebrew-tap, so
# `brew install thomasfranke/tap/writrun` resolves
# (technical/distribution/routes.md). A cask, not a formula: GoReleaser
# deprecated formula generation, and `goreleaser check` fails on it.
# The binaries are not notarized, so the post-install hook clears the
# quarantine attribute macOS puts on a downloaded executable.
homebrew_casks:
  - name: writrun
    ids: [writrun]
    binaries: [writrun]
    directory: Casks
    repository:
      owner: thomasfranke
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/thomasfranke/writrun-cli
    description: The porcelain for WritRun, one binary over the methodology's own scripts.
    license: MIT-0
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/writrun"]
          end
