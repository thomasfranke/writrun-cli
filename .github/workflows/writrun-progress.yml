name: writrun progress

# The forge's in-flight events, written where they belong: the task's
# status line on the base branch (Stage 2), then the mirrored Issue's
# label projected *from that write* (Stage 3) — one derivation, never
# two. One workflow because they answer the same events; two jobs
# because they are two stages, gated separately, and the mirror runs
# after the recording so it reads what the machinery just wrote.
#
# Every step's logic lives in .writrun/scripts/, where the test suite's
# integration tier executes it — YAML here only wires events onto
# scripts. The edge table is flip_task_status.sh and
# product/stage-2-pull-requests/statuses.md; the projection is
# rederive_labels.sh via project_pr_tasks.sh.
#
# Trust posture, and it differs by event:
#   - pull_request_target: safe by construction — jobs run base-branch
#     code and the PR's fields travel through env as data.
#   - pull_request_review: GITHUB_SHA points at PR-controlled code, so
#     every checkout below pins the default branch explicitly — a bare
#     checkout would execute the PR's own tree with credentials on
#     disk. And a fork PR's review delivers a read-only token, so this
#     workflow skips fork reviews; the state heals at the next _target
#     event (converted_to_draft, ready_for_review, closed all still
#     fire).
#
# `edited` is here because the title is one of the two routes into the
# carried set, and it is the author's to rewrite after the recording. A
# pull request recorded under one tag and retitled to nine had no event
# read the new title, so the tasks it named were never in flight and the
# close could not release them. The event also fires on body and base
# edits, which carry no claim; the recorder answers those from
# `changes.title.from` alone, at no cost.
#
# The burst posture was checked before the trigger was added, not after.
# Neither a body-only edit nor a retitle that adds no task reaches the
# Commit step — it stands down on `git diff --quiet -- work/tasks` — so
# a burst of edits costs runners and no pushes. Only an edit that adds a
# task races, and the carried ceiling bounds those at QL_CARRIED_MAX.
# push_recording.sh's five-attempt budget is sized for five; an author
# adding one tag at a time up to the ceiling could out-run it, and the
# result is a red run on their own pull request with the recording not
# landed, healed by the next event. Visible and bounded, so the budget
# stays where push_recording.sh's header sized it (spec-0077's Outcome
# records this).
# Pushes made with GITHUB_TOKEN trigger no workflow runs, which is what
# keeps the recording from looping.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, review_requested, edited, closed]
  pull_request_review:
    types: [submitted]

# One writer per pull request's recording: two events a second apart are
# a normal agent flow, and unserialized they race two status writers
# over one queue (report-0038, decision 0073). A group of its own, not
# the mirror family's — this workflow's writes are the task's status
# line and the labels projected from it, and its label pass re-derives
# from the authority, so it converges where the mirror mint could not.
# Both event kinds carry a pull_request, so the key resolves on every
# trigger. Queue, never cancel — a run cancelled between the recording
# and its projection leaves the two stages telling different stories.
concurrency:
  group: writrun-progress-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  gate:
    name: adoption stage
    runs-on: ubuntu-latest
    # The stage gates the whole workflow rather than each job, and it is
    # a job rather than a first step so a project below the stage starts
    # no runner at all. It always succeeds: a job that did not run is not
    # a failure, and stage_gate.sh says which of the two happened. Two
    # outputs because the two jobs below sit at different stages.
    if: github.event_name == 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      record: ${{ steps.gate2.outputs.run }}
      mirror: ${{ steps.gate3.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: gate2
        run: bash .writrun/scripts/stage-2-pull-requests/stage_gate.sh 2
      - id: gate3
        run: bash .writrun/scripts/stage-2-pull-requests/stage_gate.sh 3

  record:
    name: status on main
    needs: gate
    if: needs.gate.outputs.record == 'true'
    runs-on: ubuntu-latest
    steps:
      # Default branch only — never the PR's code (see the header note).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Apply the event to the task's status line
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The branch names one task; the title's tags name the rest,
          # and the recording reaches every one of them.
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Set by the forge only on an `edited` event whose title moved,
          # and empty on every other event and on a body-only edit — the
          # whole test the recorder needs to stand down cheaply. Through
          # env like the title beside it: both are the author's to write.
          PR_TITLE_FROM: ${{ github.event.changes.title.from }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          # `edited` fires on a closed pull request too, and the recorder
          # must not re-take what the close released. The state is the
          # pull request's own field, not the event's, so it is read here
          # rather than inferred from the action.
          PR_STATE: ${{ github.event.pull_request.state }}
          # The survivor query drops this pull request's own row from
          # the open listing — a listing that lags may still show it.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # pull_request_review carries its verdict here; every
          # pull_request_target event leaves it empty.
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          set -euo pipefail
          if [ -n "${REVIEW_STATE}" ]; then
            # Only a changes_requested review moves anything; approvals
            # and comments say nothing about who the blocker is.
            [ "${REVIEW_STATE}" = "changes_requested" ] || {
              echo "review '${REVIEW_STATE}' moves no status"; exit 0; }
            bash .writrun/scripts/stage-2-pull-requests/apply_pr_event.sh changes_requested
          else
            bash .writrun/scripts/stage-2-pull-requests/apply_pr_event.sh \
              "${{ github.event.action }}"
          fi

      - name: Commit
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git diff --quiet -- work/tasks && { echo "nothing moved"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tasks
          # The subject is a constant, held in one place both workflows
          # call (docs/technical/README.md#pr_title_style).
          git commit \
            -m "$(bash .writrun/scripts/stage-2-pull-requests/commit_subject.sh forge)" \
            -m "Pull request #${PR_NUMBER}, event ${{ github.event.action }}."
          # Another recording may have landed between checkout and here,
          # and may land again between the rebase and the push. Landing
          # is push_recording.sh's: rebase onto it rather than force —
          # an addition to the branch's history, never a replacement of
          # it — retried only while the branch keeps moving. The budget,
          # the retry test and the abort live in its header.
          bash .writrun/scripts/stage-2-pull-requests/push_recording.sh "$BASE_REF"

  reflect:
    name: mirror follows the file
    needs: [gate, record]
    # After the recording, so the projection reads what it wrote. A
    # skipped record (a stage below 2 never reaches 3) or a no-op one
    # both leave a readable queue, so only cancellation stops this.
    #
    # Except on a merged close, which this workflow does not answer at
    # all: `record` already stands down there (the merge recording owns
    # that move), and projecting anyway would read a checkout that may
    # predate the recording commit writrun-approve.yml is pushing at that
    # very moment — a third writer of one label, racing the two that were
    # already racing (docs/technical/decisions/github-issues/, 0060).
    if: >
      !cancelled() && needs.gate.outputs.mirror == 'true'
      && github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      # Default branch, freshly after the record job's push — the file
      # is the truth the mirror restates.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Project the carried tasks onto their mirrors
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash .writrun/scripts/stage-3-github-issues/project_pr_tasks.sh \
            "${{ github.repository }}" "${{ github.event.action }}"
