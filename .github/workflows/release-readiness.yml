name: release readiness

# `main` is the branch releases are cut from, so every push to it —
# including one that lands without a pull request — gets a
# releasability verdict here.
#
# The cut itself deliberately stays local (`make release`): the stamp
# commit cannot be pushed to a protected main by GITHUB_TOKEN, and the
# tokens that could are the dependency this project rejects. The script
# re-runs these same guards before tagging.
#
# YAML here is wiring only; the job executes what the suite already
# owns.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GORELEASER: v2.18.0

jobs:
  suite:
    name: script suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      # The e2e release case runs `goreleaser check` when the tool is on
      # PATH. Installing it here is what puts the release configuration
      # inside main's verdict, and the tool never releases: `install-only`.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: ${{ env.GORELEASER }}
          install-only: true
      - name: Run tests
        run: make tests
