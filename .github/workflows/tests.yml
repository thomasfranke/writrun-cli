name: tests

# This repository's own suite. Pull requests only — main has a pipeline
# of its own (release-readiness.yml), re-verifying the branch releases
# are cut from on every push to it.
#
# The order is technical/testing/ci.md's, stopping at the first
# failure: gofmt → go vet → unit with the coverage gate → integration
# → e2e — plus the cross-compile gate between vet and unit, spec-0001's
# Definition of Done (macOS, Linux, Windows, no cgo).

on:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: gofmt → vet → unit → integration → e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: cross-compile, without cgo
        run: |
          for target in darwin/arm64 linux/amd64 windows/amd64; do
            echo "go build for $target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done
      - name: unit, with the coverage gate
        run: |
          go test -coverpkg=./internal/... -coverprofile=cover.out ./...
          go tool cover -func=cover.out | awk '
            $1 == "total:" {
              seen = 1
              sub(/%/, "", $3)
              printf "coverage over internal/: %s%%\n", $3
              if ($3 + 0 < 85) { print "below the 85% gate"; exit 1 }
            }
            END { if (!seen) { print "no total: line in the cover output"; exit 1 } }'
      - name: integration
        run: make test-integration
      - name: e2e
        run: make test-e2e
